<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${post != null} ? ${post.name} : 'Новый пост'">Страница поста</title>
    <style>
        body {
          font-family: Arial, sans-serif;
          margin: 20px;
        }
        h1 {
            text-align: center;
        }
        .buttons {
          margin-top: 15px;
        }
        button {
          margin-right: 10px;
          padding: 6px 12px;
          border: none;
          border-radius: 4px;
          background-color: #007bff;
          color: #fff;
          cursor: pointer;
        }
        button:hover {
          background-color: #0056b3;
        }
        .edit-buttons {
            display: none;
        }
        .comments {
          margin-top: 30px;
          max-width: 800px;
        }
        .comment {
          border-top: 1px solid #ddd;
          padding: 10px 0;
        }
        .comment-text {
          margin-bottom: 8px;
        }
        .comment-author {
          font-weight: bold;
          color: #333;
        }
        .comment-date {
          color: #666;
          font-size: 0.8em;
          margin-left: 10px;
        }
        .likes {
          margin-top: 10px;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input[type="text"], textarea {
            width: 80%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .postName-input {
            font-family: 'Courier New', monospace;
            font-size: 36px;
            font-weight: bold;
        }
        .hashtag {
            color: #1da1f2;
            text-decoration: none;
            margin-right: 5px;
        }
        .hashtag:hover {
            text-decoration: underline;
        }
        #postImage {
            max-width: 300px;
            margin-top: 20px;
            display: block;
        }
        .add-comment {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }
        .comment-form {
            margin-top: 10px;
        }
        .comment-form textarea {
            width: 100%;
            height: 80px;
            margin-bottom: 10px;
        }
        .comment-form button {
            background-color: #28a745;
        }
        .comment-form button:hover {
            background-color: #218838;
        }
        .comment-form input {
            width: 300px;
            margin-bottom: 10px;
            padding: 8px;
        }
    </style>
</head>
<body>

<div class="form-container" id="userForm">
    <form th:action="${post != null} ? @{'/post/update/' + ${post.id}} : @{/post/add}"
          method="POST"
          enctype="multipart/form-data">

        <!-- Поля поста -->
        <input type="text" id="postName" name="name"
               th:value="${post != null} ? ${post.name} : ''"
               placeholder="Название поста"
               class="postName-input"
               required
               th:readonly="${post == null} ? false : true">

        <input type="text" id="tagsInput" name="tags"
               th:value="${post != null} ? ${post.tags} : ''"
               placeholder="Введите теги через # (например, #кошки #собаки)"
               th:readonly="${post == null} ? false : true">

        <textarea id="postContent" name="text" rows="4"
                  placeholder="Текст поста"
                  th:text="${post != null} ? ${post.text} : ''"
                  required
                  th:readonly="${post == null} ? false : true"></textarea>

        <label th:if="${post == null}">Добавить картинку</label>

        <p th:if="${post != null}">
            <img height="300" th:src="${'/post/images/'+post.id}">
        </p>
        <input type="file" id="image" name="image" accept="image/jpeg"
               onchange="showPicture(event)"/>

        <div class="likes" th:if="${post != null}">
            <button type="button" id="likeBtn">👍</button>
            <span id="likeCount" th:text="${post != null} ? ${post.likeCount} : '0'">0</span>
            <input type="hidden" id="likeCountInput" name="likeCount"
                   th:value="${post != null} ? ${post.likeCount} : '0'">
        </div>

        <!-- Кнопки для нового поста -->
        <div class="buttons" th:if="${post == null}">
            <button type="submit">Добавить этот пост</button>
        </div>

        <!-- Кнопки для существующего поста -->
        <div class="buttons" th:if="${post != null}">
            <button type="button" id="editBtn">Редактировать</button>
            <div class="edit-buttons" id="editButtons">
                <button type="submit" id="updateBtn">Обновить</button>
                <button type="button" id="cancelEditBtn">Отмена</button>
            </div>
        </div>
    </form>
</div>

<!-- Форма добавления комментария -->
<div class="add-comment" th:if="${post != null}">
    <h3>Добавить комментарий</h3>
    <form th:action="@{'/post/' + ${post.id} + '/comment'}" method="POST" class="comment-form">
        <input type="text" name="author" placeholder="Ваше имя" required>
        <textarea name="text" placeholder="Ваш комментарий..." required></textarea>
        <button type="submit">Отправить комментарий</button>
    </form>
</div>

<!-- Секция комментариев -->
<div class="comments" th:if="${post != null}">
    <h3>Комментарии</h3>

    <!-- Список комментариев -->
    <div id="commentsList">
        <div th:each="comment : ${comments}" class="comment">
            <div class="comment-author" th:text="${comment.author} + ':'"></div>
            <div class="comment-text" th:text="${comment.text}"></div>
        </div>
        <div th:if="${comments == null || comments.empty}" class="no-comments">
            Комментариев пока нет. Будьте первым!
        </div>
    </div>
</div>

<div id="post-data"
     th:data-id="${post?.id}"
     th:data-name="${post?.name}"
     th:data-text="${post?.text}"
     th:data-tags="${post?.tags}"
     th:data-like-count="${post?.likeCount}"
     style="display: none;">
</div>
<script>
    // Функция для предпросмотра изображения
    function showPicture(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.getElementById('postImage');
                if (!img) {
                    const newImg = document.createElement('img');
                    newImg.id = 'postImage';
                    newImg.style.maxWidth = '300px';
                    newImg.style.marginTop = '20px';
                    newImg.style.display = 'block';
                    document.querySelector('form').insertBefore(newImg, document.querySelector('textarea'));
                }
                document.getElementById('postImage').src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }

    // Обработчик кнопки редактирования
    document.getElementById('editBtn')?.addEventListener('click', function() {
        document.getElementById('editBtn').style.display = 'none';
        document.getElementById('editButtons').style.display = 'block';

        // Разблокируем поля для редактирования
        document.getElementById('postName').readOnly = false;
        document.getElementById('tagsInput').readOnly = false;
        document.getElementById('postContent').readOnly = false;

        // Активируем загрузку изображения
        document.getElementById('image').disabled = false;
    });

    // Обработчик кнопки отмены редактирования
    document.getElementById('cancelEditBtn')?.addEventListener('click', function() {
        document.getElementById('editBtn').style.display = 'inline-block';
        document.getElementById('editButtons').style.display = 'none';

        // Блокируем поля обратно
        document.getElementById('postName').readOnly = true;
        document.getElementById('tagsInput').readOnly = true;
        document.getElementById('postContent').readOnly = true;
        document.getElementById('image').disabled = true;
    });

    // Обработчик лайков
    document.getElementById('likeBtn')?.addEventListener('click', function() {
        const likeCountSpan = document.getElementById('likeCount');
        const likeCountInput = document.getElementById('likeCountInput');
        let currentLikes = parseInt(likeCountSpan.textContent);

        const postDataElement = document.getElementById('post-data');
        let postId = -1;
        if (postDataElement) {
            postId = postDataElement.getAttribute('data-id');
        }
        fetch(`/post/${postId}/like`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        }).catch(error => console.error('Ошибка при отправке лайка:', error));

        currentLikes += 1;
        likeCountSpan.textContent = currentLikes;
        likeCountInput.value = currentLikes;
    });
</script>
</body>
</html>
